name: Core CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install Core and test-only dependencies
        run: python -m pip install --disable-pip-version-check -e . -r requirements-test.txt
      - name: Check workflow security policy
        run: python -m tools.check_workflow_security
      - name: Run branch-aware tests and schema validation
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Enforce 90 percent coverage
        run: python -m coverage report --fail-under=90 --show-missing
      - name: Check Core budgets and contracts
        run: python -m proofweave check
      - name: Prove checks did not edit tracked files
        run: git diff --exit-code

  formal:
    name: Lean / ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PROOFWEAVE_REQUIRE_LEAN: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install pinned Lean and Mathlib
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-mathlib-cache: true
      - name: Install Core and test-only dependencies
        run: python -m pip install --disable-pip-version-check -e . -r requirements-test.txt
      - name: Run full suite with real Lean and no permitted skips
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Enforce 90 percent coverage
        run: python -m coverage report --fail-under=90 --show-missing
      - name: Build the Core evidence bundle
        run: python -m tools.evaluate core --output artifacts/evaluation
      - name: Prove checks and evaluation did not edit tracked files
        run: git diff --exit-code
      - name: Upload formal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-formal-${{ runner.os }}
          path: artifacts/evaluation/
          if-no-files-found: error
          retention-days: 30

  gate:
    name: Core CI gate
    if: always()
    needs: [unit, formal]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every unit and formal matrix job
        shell: bash
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
        run: |
          test "$UNIT_RESULT" = "success"
          test "$FORMAL_RESULT" = "success"
