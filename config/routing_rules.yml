version: 1
hard_filters:
  - verified_account_or_host_availability
  - required_tools
  - sufficient_context
  - provider_and_model_allowlists
  - privacy_constraints
  - not_deprecated_when_alternative_exists
risk_rules:
  - when: risk_score >= 75
    require_minimum_tier: ADVANCED
  - when: theorem_verification
    prefer_tier: FRONTIER
    require_cold_start: true
    prefer_different_model_family: true
  - when: formatting_or_metadata
    avoid_tier: FRONTIER
escalation_order:
  - increase_reasoning_effort
  - different_model_same_tier
  - higher_capability_tier
  - different_provider
  - bounded_evaluator_optimizer
  - human_decision
failure_status: ROUTING_FAILED
no_candidate_status: ADVISORY_ONLY
