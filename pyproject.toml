[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofweave-core"
version = "2.0.0"
description = "Minimal deterministic distillation and certification for AI-generated proofs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ProofWeave contributors"}]
dependencies = []

[project.scripts]
proofweave = "proofweave.cli:main"

[tool.setuptools.packages.find]
include = ["proofweave*"]

[tool.unittest]
start-directory = "tests"
